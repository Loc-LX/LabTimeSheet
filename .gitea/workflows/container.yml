name: Container

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: container-${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

env:
  REGISTRY: git.sechmachine.io.vn
  IMAGE_NAME: sechmachine/labtimesheet

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Verify Docker for PostgreSQL tests
        run: docker info

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:ui

      - name: Build frontend assets
        run: npm run build

      - name: Verify generated assets are committed
        run: git diff --exit-code -- src/main/resources/static/assets/app.css src/main/resources/static/assets/icons.svg

      - name: Run Maven tests
        run: ./mvnw -B test

      - name: Verify Javadoc
        run: ./mvnw -B -DskipTests -Ddoclint=all javadoc:javadoc

      - name: Verify whitespace
        run: git diff --check

  amd64:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Select image tags
        id: image
        env:
          EVENT_NAME: ${{ gitea.event_name }}
          GITEA_REF: ${{ gitea.ref }}
          GITEA_SHA: ${{ gitea.sha }}
        run: |
          publish=false
          image="$REGISTRY/$IMAGE_NAME"
          if [ "$EVENT_NAME" = "push" ] && [ "$GITEA_REF" = "refs/heads/main" ]; then
            publish=true
          fi
          {
            echo "publish=$publish"
            echo "image=$image"
            echo "tags<<EOF"
            echo "$image:sha-${GITEA_SHA}-amd64"
            if [ "$publish" = "true" ]; then
              echo "$image:sha-${GITEA_SHA}"
              echo "$image:main"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to registry
        if: steps.image.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build AMD64 image and publish main
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ steps.image.outputs.publish }}
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            VCS_REF=${{ gitea.sha }}

  arm64:
    # Gitea cannot schedule a probe on a missing label. Enable this repository variable only
    # while a trusted ubuntu-latest-arm runner is registered and online.
    if: vars.ARM64_RUNNER_AVAILABLE == 'true'
    needs: verify
    runs-on: ubuntu-latest-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Select image tag
        id: image
        env:
          EVENT_NAME: ${{ gitea.event_name }}
          GITEA_REF: ${{ gitea.ref }}
          GITEA_SHA: ${{ gitea.sha }}
        run: |
          publish=false
          image="$REGISTRY/$IMAGE_NAME"
          if [ "$EVENT_NAME" = "push" ] && [ "$GITEA_REF" = "refs/heads/main" ]; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$image:sha-${GITEA_SHA}-arm64" >> "$GITHUB_OUTPUT"

      - name: Log in to registry
        if: steps.image.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build native ARM64 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          push: ${{ steps.image.outputs.publish }}
          tags: ${{ steps.image.outputs.tag }}
          build-args: |
            VCS_REF=${{ gitea.sha }}

  manifest:
    if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/main' && vars.ARM64_RUNNER_AVAILABLE == 'true'
    needs: [amd64, arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Publish combined manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          GITEA_SHA: ${{ gitea.sha }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:sha-${GITEA_SHA}" \
            --tag "$IMAGE:main" \
            "$IMAGE:sha-${GITEA_SHA}-amd64" \
            "$IMAGE:sha-${GITEA_SHA}-arm64"

  deploy:
    if: gitea.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' && secrets.DEPLOY_HOST != '' && secrets.DEPLOY_USER != '' && secrets.DEPLOY_PRIVATE_KEY != '' && secrets.DEPLOY_KNOWN_HOSTS != ''
    needs: [verify, amd64]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      GITEA_SHA: ${{ gitea.sha }}
      IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ gitea.sha }}-amd64
      REMOTE_COMPOSE_ENV: /etc/labtimesheet/compose.env
    steps:
      - name: Prepare SSH trust files
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/labtimesheet-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
          printf 'SSH_DIR=%s\n' "$ssh_dir" >> "$GITHUB_ENV"

      - name: Roll out selected immutable SHA and retain rollback image
        shell: bash
        run: |
          set -euo pipefail
          case "$GITEA_SHA" in
            ''|*[!0-9a-f]*)
              echo "Gitea commit SHA is not a lowercase hexadecimal value" >&2
              exit 1
              ;;
          esac
          if [ "${#GITEA_SHA}" -ne 40 ]; then
            echo "Gitea commit SHA is not a full immutable commit SHA" >&2
            exit 1
          fi
          ssh_opts=(-i "$SSH_DIR/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts")
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$REMOTE_COMPOSE_ENV" "$IMAGE" <<'REMOTE'
          set -eu
          compose_env=$1
          new_image=$2
          state_dir="$(dirname "$compose_env")/deploy-state"

          test -f "$compose_env"
          mkdir -p "$state_dir"
          previous_image="$(sed -n 's/^LAB_IMAGE=//p' "$compose_env" | head -n 1)"
          if ! printf '%s\n' "$previous_image" | grep -Eq ':sha-[0-9a-f]{40}(-amd64)?$'; then
            echo "remote LAB_IMAGE is not an immutable SHA image" >&2
            exit 1
          fi
          printf '%s\n' "$previous_image" > "$state_dir/previous-image"
          chmod 600 "$state_dir/previous-image"

          replace_image() {
            image=$1
            next_env="${compose_env}.next.$$"
            awk -v image="$image" '
              BEGIN { replaced = 0 }
              /^LAB_IMAGE=/ { print "LAB_IMAGE=" image; replaced = 1; next }
              { print }
              END { if (!replaced) exit 42 }
            ' "$compose_env" > "$next_env"
            chmod 600 "$next_env"
            mv "$next_env" "$compose_env"
          }

          compose() {
            docker compose --env-file "$compose_env" "$@"
          }

          wait_for_health() {
            app_id="$(compose ps -q app)"
            test -n "$app_id"
            for attempt in $(seq 1 30); do
              health="$(docker inspect --format '{{.State.Health.Status}}' "$app_id" 2>/dev/null || true)"
              if [ "$health" = healthy ]; then
                return 0
              fi
              if [ "$health" = unhealthy ]; then
                return 1
              fi
              sleep 2
            done
            return 1
          }

          docker pull "$new_image"
          replace_image "$new_image"
          rollout_ok=true
          if ! compose up -d --no-build app; then
            rollout_ok=false
          elif ! wait_for_health; then
            rollout_ok=false
          fi
          if [ "$rollout_ok" = true ]; then
            exit 0
          fi

          echo "selected image failed rollout; attempting retained SHA rollback" >&2
          replace_image "$previous_image"
          docker pull "$previous_image"
          compose up -d --no-build app
          if wait_for_health; then
            echo "rollback completed; deployment remains failed" >&2
          else
            echo "rollback health check failed" >&2
          fi
          exit 1
          REMOTE
