name: Verify

'on':
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: verify-${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Verify Docker for PostgreSQL tests
        run: docker info

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:ui

      - name: Build frontend assets
        run: npm run build

      - name: Verify generated assets are committed
        run: git diff --exit-code -- src/main/resources/static/assets/app.css src/main/resources/static/assets/icons.svg

      - name: Run Maven tests
        run: ./mvnw -B test

      - name: Verify Javadoc
        run: ./mvnw -B -DskipTests -Ddoclint=all javadoc:javadoc

      - name: Verify whitespace
        run: git diff --check
