# Production profile. Supply every LAB_* value from the deployment environment.
spring:
  datasource:
    url: "${LAB_DB_URL}"
    username: "${LAB_DB_USERNAME}"
    password: "${LAB_DB_PASSWORD}"
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  docker:
    compose:
      enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: "${LAB_FORWARD_HEADERS_STRATEGY}"
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: strict
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: "livenessState"
        readiness:
          include: "readinessState,db"

lab:
  public-origin: "${LAB_PUBLIC_ORIGIN}"
  security:
    master-key: "${LAB_SECURITY_MASTER_KEY}"
    trusted-proxy-cidrs: "${LAB_TRUSTED_PROXY_CIDRS}"
