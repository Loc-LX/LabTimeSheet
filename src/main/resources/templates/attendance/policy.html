<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(
          pageTitle='Attendance policy',
          section='Admin',
          activeNav='policy',
          primaryAction=~{::#primary-action},
          content=~{::main})}">
<body>
<a id="primary-action" class="button" th:href="@{/dashboard}">Back to overview</a>
<main>
    <p class="page-description">Schedule future attendance policy versions; versions already in effect are immutable.</p>
    <p class="alert alert-error" th:if="${error}" role="alert" th:text="${error}"></p>
    <p class="alert" th:if="${message}" role="status" th:text="${message}"></p>

    <section class="panel">
        <header class="panel-header"><h2 class="panel-title">Schedule new version</h2></header>
        <form class="form-panel form-grid" method="post" th:action="@{/attendance/policy}">
            <div class="form-grid form-grid-three">
                <div class="field"><label class="field-label" for="effectiveFrom">Effective from</label><input class="control" id="effectiveFrom" name="effectiveFrom" type="date" required th:min="${today}" th:value="${form.effectiveFrom}"></div>
                <div class="field"><label class="field-label" for="zoneId">Timezone</label><input class="control" id="zoneId" name="zoneId" type="text" required th:value="${form.zoneId}"></div>
                <div class="field"><label class="field-label" for="scheduledStart">Start</label><input class="control" id="scheduledStart" name="scheduledStart" type="time" required th:value="${form.scheduledStart}"></div>
                <div class="field"><label class="field-label" for="scheduledEnd">End</label><input class="control" id="scheduledEnd" name="scheduledEnd" type="time" required th:value="${form.scheduledEnd}"></div>
                <div class="field"><label class="field-label" for="checkInGraceMinutes">Check-in grace (min)</label><input class="control" id="checkInGraceMinutes" name="checkInGraceMinutes" type="number" min="0" max="720" required th:value="${form.checkInGraceMinutes}"></div>
                <div class="field"><label class="field-label" for="checkoutGraceMinutes">Checkout grace (min)</label><input class="control" id="checkoutGraceMinutes" name="checkoutGraceMinutes" type="number" min="0" max="720" required th:value="${form.checkoutGraceMinutes}"></div>
                <div class="field"><label class="field-label" for="monthlyLeaveQuota">Monthly leave quota</label><input class="control" id="monthlyLeaveQuota" name="monthlyLeaveQuota" type="number" min="0" max="31" required th:value="${form.monthlyLeaveQuota}"></div>
                <div class="field"><label class="field-label" for="violationPenalty">Violation penalty</label><input class="control" id="violationPenalty" name="violationPenalty" type="number" step="0.01" min="0" max="1" required th:value="${form.violationPenalty}"></div>
            </div>
            <div class="field">
                <span class="field-label">Workdays</span>
                <label class="checkbox" th:each="day : ${days}"><input type="checkbox" name="workdays" th:value="${day}" th:checked="${form.workdays.contains(day)}"> <span th:text="${day}"></span></label>
            </div>
            <div class="form-actions"><button class="button button-primary" type="submit">Schedule version</button></div>
        </form>
    </section>

    <section class="panel" th:if="${#lists.isEmpty(versions)}"><th:block th:replace="~{fragments/components :: empty('No policy versions', 'Scheduled versions will appear here.')} "></th:block></section>
    <div class="panel table-scroll" th:unless="${#lists.isEmpty(versions)}"><table class="data-table">
        <caption>Policy timeline</caption>
        <thead><tr><th scope="col">Effective</th><th scope="col">Schedule</th><th scope="col">Grace (in/out)</th><th scope="col">Quota</th><th scope="col">Penalty</th><th scope="col">Workdays</th><th scope="col">Status</th><th scope="col">Save</th></tr></thead>
        <tbody>
        <tr th:each="row : ${versions}">
            <td>
                <input class="control" name="effectiveFrom" type="date" required th:min="${today}" th:value="${row.policy.effectiveFrom}" th:attr="form=|policy-${row.policy.id}|" th:disabled="${!row.policy.effectiveFrom.isAfter(today)}" aria-label="Effective date">
            </td>
            <td>
                <div class="field"><input class="control" name="zoneId" type="text" required th:value="${row.policy.zoneId}" th:attr="form=|policy-${row.policy.id}|" th:disabled="${!row.policy.effectiveFrom.isAfter(today)}" aria-label="Timezone"></div>
                <div class="form-grid form-grid-three">
                    <input class="control" name="scheduledStart" type="time" required th:value="${row.policy.scheduledStart}" th:attr="form=|policy-${row.policy.id}|" th:disabled="${!row.policy.effectiveFrom.isAfter(today)}" aria-label="Start">
                    <input class="control" name="scheduledEnd" type="time" required th:value="${row.policy.scheduledEnd}" th:attr="form=|policy-${row.policy.id}|" th:disabled="${!row.policy.effectiveFrom.isAfter(today)}" aria-label="End">
                    <span></span>
                </div>
            </td>
            <td>
                <div class="form-grid form-grid-two">
                    <input class="control" name="checkInGraceMinutes" type="number" min="0" max="720" required th:value="${row.policy.checkInGraceMinutes}" th:attr="form=|policy-${row.policy.id}|" th:disabled="${!row.policy.effectiveFrom.isAfter(today)}" aria-label="Check-in grace">
                    <input class="control" name="checkoutGraceMinutes" type="number" min="0" max="720" required th:value="${row.policy.checkoutGraceMinutes}" th:attr="form=|policy-${row.policy.id}|" th:disabled="${!row.policy.effectiveFrom.isAfter(today)}" aria-label="Checkout grace">
                </div>
            </td>
            <td><input class="control" name="monthlyLeaveQuota" type="number" min="0" max="31" required th:value="${row.policy.monthlyLeaveQuota}" th:attr="form=|policy-${row.policy.id}|" th:disabled="${!row.policy.effectiveFrom.isAfter(today)}" aria-label="Monthly leave quota"></td>
            <td><input class="control" name="violationPenalty" type="number" step="0.01" min="0" max="1" required th:value="${row.policy.violationPenalty}" th:attr="form=|policy-${row.policy.id}|" th:disabled="${!row.policy.effectiveFrom.isAfter(today)}" aria-label="Violation penalty"></td>
            <td>
                <div class="field">
                    <label class="checkbox" th:each="day : ${days}"><input type="checkbox" name="workdays" th:value="${day}" th:checked="${row.policy.workdays.contains(day)}" th:attr="form=|policy-${row.policy.id}|" th:disabled="${!row.policy.effectiveFrom.isAfter(today)}" aria-label="Workday"> <span th:text="${day}"></span></label>
                </div>
            </td>
            <td><span class="badge" th:text="${row.policy.effectiveFrom.isAfter(today)} ? 'FUTURE' : 'EFFECTIVE'">FUTURE</span></td>
            <td>
                <form th:if="${row.policy.effectiveFrom.isAfter(today)}" method="post" th:id="|policy-${row.policy.id}|" th:action="@{/attendance/policy/{id}(id=${row.policy.id})}">
                    <input name="version" type="hidden" th:value="${row.version}">
                    <button class="button button-primary" type="submit">Save</button>
                </form>
                <span th:unless="${row.policy.effectiveFrom.isAfter(today)}" class="text-muted">Immutable</span>
            </td>
        </tr>
        </tbody>
    </table></div>
</main>
</body>
</html>
