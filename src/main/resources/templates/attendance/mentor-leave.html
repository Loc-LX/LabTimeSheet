<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(
          pageTitle='Leave decisions',
          section='Mentor',
          activeNav='leaveDecisions',
          primaryAction=~{} ,
          content=~{::main})}">
<body>
<main>
    <p class="page-description">Decide pending leave requests before their first counted workday starts; decisions are final.</p>
    <p class="alert alert-error" th:if="${error}" role="alert" th:text="${error}"></p>
    <p class="alert" th:if="${message}" role="status" th:text="${message}"></p>

    <section class="panel">
        <header class="panel-header"><h2 class="panel-title">Pending decisions</h2></header>
        <th:block th:if="${#lists.isEmpty(decisions)}"><th:block th:replace="~{fragments/components :: empty('No leave requests', 'Intern leave requests will appear here.')} "></th:block></th:block>
        <div class="table-scroll" th:unless="${#lists.isEmpty(decisions)}">
            <table class="data-table">
                <caption class="sr-only">Leave decisions</caption>
                <thead><tr><th scope="col">Intern</th><th scope="col">Dates</th><th scope="col">Reason</th><th scope="col">Counted days</th><th scope="col">Status</th><th scope="col">Decision</th></tr></thead>
                <tbody>
                <tr th:each="row : ${decisions}">
                    <td th:text="${row.internDisplayName}">Intern</td>
                    <td th:text="|${#temporals.format(row.startDate, 'dd/MM/yyyy')} → ${#temporals.format(row.endDate, 'dd/MM/yyyy')}|">Date</td>
                    <td th:text="${row.reason}">Reason</td>
                    <td th:text="${#lists.size(row.countedDays)}">0</td>
                    <td><span class="badge" th:text="${row.status}">PENDING</span></td>
                    <td>
                        <form th:if="${row.status == 'PENDING'}" method="post" th:action="@{/mentor/leave/{id}/approve(id=${row.id})}" class="inline-actions">
                            <input class="control control-inline" type="text" name="decisionNote" maxlength="200" placeholder="Optional note">
                            <button class="button button-primary" type="submit">Approve</button>
                        </form>
                        <form th:if="${row.status == 'PENDING'}" method="post" th:action="@{/mentor/leave/{id}/reject(id=${row.id})}" class="inline-actions">
                            <button class="button button-secondary" type="submit">Reject</button>
                        </form>
                        <span th:unless="${row.status == 'PENDING'}" class="text-muted" th:text="|Decided at ${#temporals.format(row.firstCountedStartAt, 'dd/MM/yyyy HH:mm')}|">Decided</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
