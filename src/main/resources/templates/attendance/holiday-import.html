<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(
          pageTitle='Preview Vietnamese holidays',
          section='Admin',
          activeNav='calendar',
          primaryAction=~{::#primary-action},
          content=~{::main})}">
<body>
<a id="primary-action" class="button" th:href="@{/attendance/calendar}">Back to calendar</a>
<main>
    <p class="page-description">Review HolidayAPI candidates before importing them into the global calendar.</p>
    <p class="alert alert-error" th:if="${error}" role="alert" th:text="${error}"></p>
    <p class="alert" th:if="${message}" role="status" th:text="${message}"></p>

    <section class="panel">
        <form class="form-panel form-grid" method="get" th:action="@{/attendance/calendar/holidays}">
            <div class="field"><label class="field-label" for="year">Year</label><input class="control" id="year" name="year" type="number" min="2000" max="2100" required th:value="${year}"></div>
            <div class="form-actions"><button class="button" type="submit">Preview</button></div>
        </form>
        <p class="page-description" th:if="${#lists.isEmpty(preview)} and !${error}">No holiday candidates were returned for this year.</p>
    </section>

    <form class="panel table-scroll" method="post" th:action="@{/attendance/calendar/holidays}" th:object="${form}" th:if="${!#lists.isEmpty(preview)}">
        <input type="hidden" th:field="*{year}">
        <table class="data-table">
            <caption>Holiday candidates for <span th:text="${year}"></span></caption>
            <thead><tr><th scope="col">Import</th><th scope="col">Holiday</th><th scope="col">Actual / observed</th><th scope="col">Public</th><th scope="col">Admin decision</th></tr></thead>
            <tbody>
            <tr th:each="row, stat : ${preview}">
                <td>
                    <input type="checkbox" th:field="*{selections[__${stat.index}__].selected}" aria-label="Import">
                    <input type="hidden" th:field="*{selections[__${stat.index}__].uuid}">
                </td>
                <td th:text="${row.candidate.name}"></td>
                <td th:text="|${row.candidate.actualDate} / ${row.candidate.observedDate}|"></td>
                <td>
                    <span th:text="${row.candidate.publicHoliday} ? 'Yes' : 'No'"></span>
                    <span class="page-description" th:if="${row.alreadyImported}">(already imported)</span>
                </td>
                <td>
                    <select class="control" th:field="*{selections[__${stat.index}__].dayOff}">
                        <option value="true">Day off</option>
                        <option value="false">Working day</option>
                    </select>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="form-actions"><button class="button button-primary" type="submit">Import selected</button></div>
    </form>
</main>
</body>
</html>
