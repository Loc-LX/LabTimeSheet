<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(
          pageTitle=${project.name},
          section='Projects',
          activeNav='projects',
          primaryAction=~{},
          content=~{::main})}">
<body>
<main>
    <th:block th:replace="~{fragments/components :: projectTabs(${project.id}, 'members')}"></th:block>
    <section class="panel form-panel">
        <div class="panel-header history-toolbar">
            <div>
                <h2 class="panel-title">Member history</h2>
                <p class="field-help">Read-only history of every Intern membership interval.</p>
            </div>
            <a class="button" th:href="@{/projects/{id}/members(id=${project.id})}">Current members</a>
        </div>
        <th:block th:if="${#lists.isEmpty(members)}"
                  th:replace="~{fragments/components :: empty('No membership history', 'Project membership intervals will appear here.')} "></th:block>
        <div class="table-scroll" th:unless="${#lists.isEmpty(members)}">
            <table class="data-table">
                <caption class="sr-only">Membership history</caption>
                <thead><tr><th scope="col">Intern</th><th scope="col">Joined</th><th scope="col">Left</th><th scope="col">Role</th></tr></thead>
                <tbody>
                <tr th:each="member : ${members}">
                    <td th:text="${member.displayName}">Intern</td>
                    <td th:text="${#temporals.format(member.joinedAt, 'dd/MM/yyyy HH:mm')}">Joined</td>
                    <td th:text="${member.leftAt == null ? 'Current' : #temporals.format(member.leftAt, 'dd/MM/yyyy HH:mm')}">Current</td>
                    <td><span class="badge" th:classappend="${member.currentLeader ? ' badge-success' : ''}" th:text="${member.currentLeader ? 'Leader' : 'Member'}">Member</span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
