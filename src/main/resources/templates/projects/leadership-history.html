<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(
          pageTitle=${project.name},
          section='Projects',
          activeNav='projects',
          primaryAction=~{},
          content=~{::main})}">
<body>
<main>
    <th:block th:replace="~{fragments/components :: projectTabs(${project.id}, 'leadership')}"></th:block>
    <section class="panel form-panel">
        <div class="panel-header history-toolbar">
            <div>
                <h2 class="panel-title">Leadership history</h2>
                <p class="field-help">Read-only history of every Project Leader term.</p>
            </div>
            <a class="button" th:href="@{/projects/{id}/leadership(id=${project.id})}">Current Leader</a>
        </div>
        <th:block th:if="${#lists.isEmpty(leadership)}"
                  th:replace="~{fragments/components :: empty('No leadership history', 'Leadership terms will appear here.')} "></th:block>
        <div class="table-scroll" th:unless="${#lists.isEmpty(leadership)}">
            <table class="data-table">
                <caption class="sr-only">Leadership history</caption>
                <thead><tr><th scope="col">Leader</th><th scope="col">Started</th><th scope="col">Ended</th></tr></thead>
                <tbody>
                <tr th:each="term : ${leadership}">
                    <td th:text="${term.leaderName}">Leader</td>
                    <td th:text="${#temporals.format(term.startedAt, 'dd/MM/yyyy HH:mm')}">Started</td>
                    <td th:text="${term.endedAt == null ? 'Current' : #temporals.format(term.endedAt, 'dd/MM/yyyy HH:mm')}">Current</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
