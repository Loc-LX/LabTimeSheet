<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(
          pageTitle=${project.name},
          section='Projects',
          activeNav='projects',
          primaryAction=~{},
          content=~{::main})}">
<body>
<main>
    <th:block th:replace="~{fragments/components :: projectTabs(${project.id}, 'leadership')}"></th:block>
    <form class="panel form-panel form-grid" th:if="${project.canManage}" method="post" th:action="@{/projects/{id}/leadership(id=${project.id})}" th:object="${projectMemberForm}">
        <input type="hidden" th:field="*{expectedLeadershipTermId}">
        <div class="alert alert-error" data-leader-validation-alert role="alert" th:if="${#fields.hasAnyErrors()}">Please correct the Leader selection.</div>
        <div class="field" data-leader-dropdown>
            <span class="field-label">New Leader</span>
            <input type="hidden" data-leader-dropdown-value-input id="internUserId" name="internUserId" value="">
            <div class="leader-dropdown">
                <button class="leader-dropdown-trigger" type="button" data-leader-dropdown-trigger
                        aria-haspopup="listbox" aria-expanded="false" aria-controls="leadership-leader-options"
                        th:disabled="${#lists.isEmpty(eligibleInternOptions)}"
                        th:attr="aria-invalid=${#fields.hasErrors('internUserId')},aria-describedby=${#fields.hasErrors('internUserId') ? 'leadership-intern-user-error' : null}">
                    <span data-leader-dropdown-value>Choose a current member</span>
                    <span aria-hidden="true">⌄</span>
                </button>
                <div class="leader-dropdown-menu" id="leadership-leader-options" data-leader-dropdown-menu hidden>
                    <label class="field-label" for="leadership-leader-search">Search by name or Student Code</label>
                    <input class="control" id="leadership-leader-search" type="search" autocomplete="off"
                           data-leader-dropdown-search placeholder="Search current members">
                    <div class="leader-dropdown-options" role="listbox" aria-label="Eligible current members">
                        <button class="leader-dropdown-option" type="button" role="option"
                                data-leader-dropdown-option
                                th:each="option : ${eligibleInternOptions}"
                                th:attr="data-value=${option.userId},data-label=|${option.displayName} (${option.studentCode})|,data-search=|${option.displayName} ${option.studentCode}|,data-selected=${option.userId == projectMemberForm.internUserId}">
                            <span>
                                <strong th:text="|${option.displayName} (${option.studentCode})|">Intern (Code)</strong>
                                <small th:text="|${#temporals.format(option.internshipStart, 'dd/MM/yyyy')} – ${#temporals.format(option.internshipEnd, 'dd/MM/yyyy')}|">Dates</small>
                            </span>
                        </button>
                        <p class="leader-dropdown-empty" data-leader-dropdown-empty
                           th:hidden="${!#lists.isEmpty(eligibleInternOptions)}">No matching eligible current members.</p>
                    </div>
                </div>
            </div>
            <p class="field-help" th:if="${#lists.isEmpty(eligibleInternOptions)}">No eligible current members are available.</p>
            <p class="field-error" id="leadership-intern-user-error" data-leader-validation-error role="alert" th:if="${#fields.hasErrors('internUserId')}" th:errors="*{internUserId}"></p>
        </div>
        <div class="form-actions">
            <button class="button button-danger" type="submit"
                    title="Replaces the Leader and removes the previous Leader from the Project. Unfinished Tasks assigned to them move to the new Leader."
                    th:attr="formaction=@{/projects/{id}/leadership/remove(id=${project.id})}">Replace and remove current Leader</button>
            <button class="button button-primary" type="submit"
                    title="Changes the Leader only; the previous Leader stays as a current Project member.">Change Leader</button>
        </div>
    </form>
    <section class="panel form-panel" th:if="${#lists.isEmpty(leadership)}">
        <div class="panel-header history-toolbar">
            <h2 class="panel-title">Current Leader</h2>
            <a class="button" th:href="@{/projects/{id}/leadership/history(id=${project.id})}">History</a>
        </div>
        <th:block th:replace="~{fragments/components :: empty('No current Leader', 'This Project has no active Leader.')} "></th:block>
    </section>
    <section class="panel form-panel" th:unless="${#lists.isEmpty(leadership)}">
        <div class="panel-header history-toolbar">
            <h2 class="panel-title">Current Leader</h2>
            <a class="button" th:href="@{/projects/{id}/leadership/history(id=${project.id})}">History</a>
        </div>
        <div class="table-scroll"><table class="data-table"><caption class="sr-only">Current Leader</caption><thead><tr><th scope="col">Leader</th><th scope="col">Started</th><th scope="col">Ended</th></tr></thead>
            <tbody><tr th:each="term : ${leadership}"><td th:text="${term.leaderName}">Leader</td><td th:text="${#temporals.format(term.startedAt, 'dd/MM/yyyy HH:mm')}">Started</td><td th:text="${term.endedAt == null ? 'Current' : #temporals.format(term.endedAt, 'dd/MM/yyyy HH:mm')}">Current</td></tr></tbody>
        </table></div>
    </section>
</main>
</body>
</html>
