<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(
          pageTitle=${project.name},
          section='Projects',
          activeNav='projects',
          primaryAction=~{::#primary-action},
          content=~{::main})}">
<body>
<a id="primary-action" class="button button-primary" th:href="@{/projects/{id}/tasks(id=${project.id})}">View Tasks</a>
<main>
    <th:block th:replace="~{fragments/components :: projectTabs(${project.id}, 'overview')}"></th:block>
    <p class="page-description" th:text="${project.description == null || #strings.isEmpty(project.description) ? 'No Project description.' : project.description}">Project description.</p>
    <p class="alert alert-error" role="alert" th:if="${projectError}" th:text="${projectError}"></p>
    <section class="panel metric-strip" aria-label="Project details">
        <div class="metric"><div class="metric-label">Status</div><div class="metric-value"><span class="badge" th:classappend="${project.status == 'ACTIVE' ? ' badge-success' : ''}" th:text="${project.status}">PLANNED</span></div></div>
        <div class="metric"><div class="metric-label">Mentor</div><div class="metric-value" th:text="${project.mentorName}">Mentor</div></div>
        <div class="metric"><div class="metric-label">Leader</div><div class="metric-value" th:text="${project.leaderName ?: 'No current Leader'}">Leader</div></div>
        <div class="metric"><div class="metric-label">Project window</div><div class="metric-value" th:text="${#temporals.format(project.startDate, 'dd/MM/yyyy') + ' – ' + #temporals.format(project.endDate, 'dd/MM/yyyy')}">15/08/2026 – 30/09/2026</div></div>
    </section>
    <form class="inline-actions" th:if="${project.canManage and project.status == 'PLANNED'}" th:action="@{/projects/{id}/activate(id=${project.id})}" method="post">
        <button class="button button-primary" type="submit">Activate</button>
    </form>
    <form class="inline-actions" th:if="${project.canManage and project.status == 'PLANNED'}"
          th:action="@{/projects/{id}/delete(id=${project.id})}" method="post"
          data-confirm="Delete this planned Project? Its memberships, invitations, Tasks, and history will be removed.">
        <button class="button button-danger" type="submit">Delete Project</button>
    </form>
    <section class="panel form-panel" th:each="readiness : ${exitReadiness}">
        <header class="panel-header"><h2 class="panel-title">Exit readiness</h2></header>
        <p class="field-help" th:if="${readiness.targetIsCurrentLeader}">Appoint a replacement Leader before this exit can be approved.</p>
        <p class="field-help" th:if="${readiness.unfinishedTaskCount > 0}" th:text="|${readiness.unfinishedTaskCount} unfinished Tasks remain before Mentor decision.|">Unfinished Tasks remain.</p>
        <p class="field-help" th:if="${readiness.readyForApproval}">Ready for Mentor decision.</p>
        <a class="button" th:href="@{/projects/{id}/workflows(id=${project.id})}">Open exit workflow</a>
    </section>
</main>
</body>
</html>
