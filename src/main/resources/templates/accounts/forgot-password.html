<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/auth-layout :: shell(
          pageTitle='Forgot password',
          eyebrow='Account recovery',
          content=~{::main})}">
<body>
<main>
  <p class="page-description">Enter your email. If the account can receive recovery mail, a single-use link will be sent.</p>
  <p class="alert" th:if="${param.requested}" role="status">If the address is eligible, recovery instructions have been sent.</p>
  <form class="form-grid auth-form" method="post" th:action="@{/forgot-password}" th:object="${forgotPasswordForm}">
    <div class="alert alert-error" th:if="${#fields.hasAnyErrors()}" role="alert">
      <p th:each="error : ${#fields.allErrors()}" th:text="${error}"></p>
    </div>
    <div class="field">
      <label class="field-label" for="email">Email</label>
      <input class="control" id="email" th:field="*{email}" type="email" autocomplete="email" required>
    </div>
    <button class="button button-primary" type="submit">Send recovery link</button>
  </form>
</main>
</body>
</html>
