<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/auth-layout :: shell(
          pageTitle='Reset your password',
          eyebrow='Password recovery',
          content=~{::main})}">
<body>
<main>
  <p class="page-description">Enter the email address for your account. If it matches an active account, we will send a single-use reset link that expires in 30 minutes.</p>
  <p class="alert" th:if="${param.sent}" role="status">If an active account matches that email, a password-reset link is on its way.</p>
  <form class="form-grid auth-form" method="post" th:action="@{/forgot-password}" th:object="${forgotPasswordForm}">
    <div class="alert alert-error" th:if="${#fields.hasGlobalErrors()}" role="alert">
      <p th:each="fieldError : ${#fields.globalErrors()}" th:text="${fieldError}"></p>
    </div>
    <div class="field">
      <label class="field-label" for="email">Email</label>
      <input class="control" id="email" th:field="*{email}" type="email" autocomplete="username" required autofocus th:attr="aria-invalid=${#fields.hasErrors('email')},aria-describedby=${#fields.hasErrors('email') ? 'forgot-password-email-error' : null}">
      <p class="field-error" id="forgot-password-email-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}" role="alert"></p>
    </div>
    <button class="button button-primary" type="submit">Send reset link</button>
  </form>
</main>
</body>
</html>
