<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/auth-layout :: shell(
          pageTitle='Reset password',
          eyebrow='Account recovery',
          content=~{::main})}">
<body>
<main>
  <p class="page-description">Choose a new password. This link can be used once and expires shortly.</p>
  <p class="alert alert-error" th:if="${error}" th:text="${error}" role="alert"></p>
  <form class="form-grid auth-form" method="post" th:action="@{/reset-password}" th:object="${passwordResetForm}">
    <div class="alert alert-error" th:if="${#fields.hasGlobalErrors()}" role="alert">
      <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
    </div>
    <input th:field="*{token}" type="hidden">
    <div class="field">
      <label class="field-label" for="password">Password</label>
      <input class="control" id="password" th:field="*{password}" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
    </div>
    <div class="field">
      <label class="field-label" for="confirmPassword">Confirm password</label>
      <input class="control" id="confirmPassword" th:field="*{confirmPassword}" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
    </div>
    <button class="button button-primary" type="submit">Reset password</button>
  </form>
</main>
</body>
</html>
