<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(
          pageTitle='Accounts and internships',
          section='Admin',
          activeNav='accounts',
          primaryAction=~{::#primary-action},
          content=~{::main})}">
<body>
<a id="primary-action" class="button button-primary" th:href="@{/admin/accounts/new}">Create account</a>
<main>
    <p class="page-description">Create accounts, manage account state, and control Intern lifecycle.</p>
    <nav class="tabs" aria-label="Account roles">
        <a class="tab" th:href="@{/admin/accounts}" th:attr="aria-current=${selectedRole == null} ? 'page' : null">All</a>
        <a class="tab" th:href="@{/admin/accounts(role='ADMIN')}" th:attr="aria-current=${selectedRole?.name() == 'ADMIN'} ? 'page' : null">Admins</a>
        <a class="tab" th:href="@{/admin/accounts(role='MENTOR')}" th:attr="aria-current=${selectedRole?.name() == 'MENTOR'} ? 'page' : null">Mentors</a>
        <a class="tab" th:href="@{/admin/accounts(role='INTERN')}" th:attr="aria-current=${selectedRole?.name() == 'INTERN'} ? 'page' : null">Interns</a>
    </nav>
    <section class="panel" th:if="${#lists.isEmpty(accountRows)}"><th:block th:replace="~{fragments/components :: empty('No accounts', 'Accounts in this role will appear here.')} "></th:block></section>
    <section class="panel" th:unless="${#lists.isEmpty(accountRows)}">
        <div class="table-scroll"><table class="data-table"><caption class="sr-only">Accounts and internships</caption><thead><tr><th scope="col">Name</th><th scope="col">Role</th><th scope="col">Account state</th><th scope="col">Internship</th><th scope="col">Last sign-in</th><th scope="col"><span class="sr-only">Actions</span></th></tr></thead>
            <tbody><tr th:each="row : ${accountRows}" class="table-row-link"><td><a class="stretched-link" th:href="@{/admin/accounts/{id}(id=${row.id})}" th:text="${row.displayName}">Name</a><br><small class="muted" th:text="${row.email}">email</small></td><td th:text="${row.role}">ROLE</td><td><span class="badge" th:classappend="${row.status.name() == 'LOCKED' ? ' badge-warning' : row.status.name() == 'DEACTIVATED' ? ' badge-danger' : ''}" th:text="${row.status}">STATUS</span></td><td><span th:if="${row.internshipStatus == null}">—</span><span th:unless="${row.internshipStatus == null}" th:text="${row.internshipStatus.name() + (row.internshipEndDate != null ? ' · ends ' + #temporals.format(row.internshipEndDate, 'dd/MM') : '')}">INTERNSHIP</span></td><td th:text="${row.lastLoginAt == null ? 'Never' : #temporals.format(row.lastLoginAt, 'dd/MM/yyyy HH:mm')}">Never</td><td><a class="icon-button" th:href="@{/admin/accounts/{id}/edit(id=${row.id})}" th:aria-label="${'Edit ' + row.displayName}"><svg class="nav-icon" aria-hidden="true"><use th:href="@{/assets/icons.svg#pencil}"></use></svg></a></td></tr></tbody>
        </table></div>
    </section>
</main>
</body>
</html>
